name: Research round 3 (day trading)

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run research
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
        run: python research3.py
