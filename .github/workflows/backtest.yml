name: Backtest

on:
  workflow_dispatch:
    inputs:
      robust:
        description: 'Also run the full robustness check (slow)'
        type: boolean
        default: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          ROBUST: ${{ inputs.robust && '1' || '0' }}
        run: python backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: backtest_trades.csv
